# 加进 /etc/nginx/sites-available/catfan 的 server 块。
# 静态产物仍由 nginx 从 /srv/services/catFan/dist 直接读。

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 导入备份的请求体可能到几 MB。
    client_max_body_size 12m;
}

# 接口目前没有鉴权，任何能访问这个站点的人都能读写全部数据。
# 要补的话在这里加一层，应用代码不用动：
#
#   auth_basic "catFan";
#   auth_basic_user_file /etc/nginx/.htpasswd-catfan;
#
# 生成密码文件：sudo htpasswd -c /etc/nginx/.htpasswd-catfan <用户名>
