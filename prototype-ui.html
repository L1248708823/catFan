<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>喂养计算器 UI 原型</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211b;background:#f5f6f2;line-height:1.45;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
    .prototype-note{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid #313934;background:#17211b;color:#fff;box-shadow:0 12px 30px #17211b2b;border-radius:999px;font-size:12px}
    .prototype-note button{border:0;background:transparent;color:#fff;width:28px;height:28px;border-radius:50%;font-size:18px}.prototype-note button:hover{background:#ffffff1c}.prototype-note strong{font-size:12px;letter-spacing:.02em;min-width:145px;text-align:center}
    .shell{min-height:100vh}.topbar{height:68px;border-bottom:1px solid #dce2da;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.02em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#dbeee5;color:#176448;font-weight:800}.top-actions{display:flex;align-items:center;gap:9px}.button{border:1px solid #cbd5cd;background:#fff;color:#17211b;padding:9px 13px;border-radius:9px;font-size:13px}.button.primary{background:#176448;color:#fff;border-color:#176448}.button.ghost{border-color:transparent;background:transparent}.button:hover{filter:brightness(.97)}
    .workspace{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{border-right:1px solid #dce2da;background:#fbfcf9;padding:22px 14px}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7b877e;padding:0 11px;margin:4px 0 9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;color:#546158;padding:11px;border-radius:8px;font-size:14px}.nav button.active,.nav button:hover{background:#e8f1eb;color:#176448;font-weight:650}.content{width:min(1200px,100%);margin:0 auto;padding:34px clamp(18px,4vw,58px) 100px}.eyebrow{font-size:12px;color:#748078;margin:0 0 7px}.heading{font-size:28px;line-height:1.18;letter-spacing:-.02em;margin:0}.muted{color:#728077;font-size:13px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:32px 0 14px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.01em}.section-head .muted{margin:0}.status{display:inline-flex;align-items:center;gap:6px;color:#4b6656;background:#edf5ef;border:1px solid #d4e7d9;border-radius:999px;padding:5px 9px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#2b986b}
    .summary{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-bottom:1px solid #dce2da;padding-bottom:28px}.summary-meta{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}.meta-label{font-size:11px;color:#758278}.meta-value{font-size:15px;margin-top:3px}.surface{background:#fff;border:1px solid #dce2da;border-radius:12px}.model-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.model{padding:18px}.model-head{display:flex;align-items:center;justify-content:space-between}.model-name{font-size:13px;color:#58665c;font-weight:650}.model h3{font-size:28px;letter-spacing:-.03em;margin:20px 0 2px}.model-foot{border-top:1px solid #edf0eb;margin-top:15px;padding-top:12px;display:flex;justify-content:space-between;align-items:center}.text-button{border:0;background:none;color:#176448;padding:0;font-size:13px}.conversion-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 15px;background:#edf5ef;border:1px solid #d4e7d9;border-radius:10px;margin-bottom:13px}.conversion-bar select{border:1px solid #b8cbbd;border-radius:7px;background:#fff;color:#17211b;padding:7px 28px 7px 9px}.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.calc{padding:18px}.calc-top{display:flex;justify-content:space-between;gap:10px}.calc h3{font-size:16px;margin:2px 0 4px}.calc-tag{font-size:11px;color:#637068;background:#f1f4f0;padding:4px 7px;border-radius:5px;height:max-content}.food-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0eb;margin-top:15px;padding-top:14px}.food-name{font-size:13px}.food-value{text-align:right;font-size:21px;letter-spacing:-.02em;font-weight:700}.food-unit{display:block;color:#728077;font-size:11px;font-weight:400;margin-top:1px}.calc-actions{display:flex;gap:14px;margin-top:18px}.recent{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.recent .surface{padding:18px}.list{display:grid;gap:13px;margin-top:15px}.list-row{display:flex;justify-content:space-between;gap:16px;font-size:13px}.list-row small{display:block;color:#7b877e;font-size:11px;margin-top:2px}.chart{height:118px;margin-top:15px;position:relative;overflow:hidden;background:linear-gradient(to bottom,transparent 0 32%,#edf0eb 33% 34%,transparent 35% 65%,#edf0eb 66% 67%,transparent 68%)}.chart svg{width:100%;height:100%}.chart line{stroke:#dfe7df}.chart polyline{fill:none;stroke:#176448;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chart circle{fill:#fff;stroke:#176448;stroke-width:2}
    /* Variant B */
    .focus-page{background:#f7f8f5;min-height:100vh}.focus-header{height:72px;border-bottom:1px solid #dce2da;background:#fff;padding:0 clamp(18px,6vw,100px);display:flex;justify-content:space-between;align-items:center}.focus-main{width:min(760px,100%);margin:0 auto;padding:44px 18px 100px}.focus-title{font-size:32px;letter-spacing:-.035em;line-height:1.12;margin:0}.focus-intro{font-size:14px;color:#66736a;margin:12px 0 28px}.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.step-no{width:26px;height:26px;border:1px solid #b5c8b9;border-radius:50%;display:grid;place-items:center;color:#176448;font-size:12px;flex:none}.step-content{flex:1}.step-content h2{font-size:16px;margin:3px 0 10px}.choice-row{display:flex;gap:9px;flex-wrap:wrap}.choice{border:1px solid #ccd8ce;background:#fff;padding:10px 13px;border-radius:8px;color:#4c5d51;font-size:13px}.choice.selected{border-color:#176448;background:#e8f3ec;color:#176448;box-shadow:0 0 0 2px #1764481a}.result-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 14px}.result-box{background:#17211b;color:#fff;border-radius:11px;padding:16px}.result-box span{display:block;color:#b6c7bc;font-size:12px}.result-box strong{display:block;font-size:25px;letter-spacing:-.03em;margin-top:9px}.focus-card{background:#fff;border:1px solid #dce2da;border-radius:11px;padding:18px;margin-top:12px}.focus-card h3{font-size:15px;margin:0}.focus-card .small{color:#768279;font-size:12px;margin-top:3px}.quantity{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px}.quantity input{width:95px;border:1px solid #cbd5cd;border-radius:7px;padding:9px}.focus-save{width:100%;margin-top:20px;padding:12px}.link-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.focus-footer{margin-top:34px;padding-top:18px;border-top:1px solid #dce2da;display:flex;justify-content:space-between;color:#718077;font-size:12px}
    /* Variant C */
    .control-page{min-height:100vh;background:#edf0eb}.control-grid{display:grid;grid-template-columns:355px minmax(0,1fr);min-height:100vh}.control-panel{background:#17211b;color:#f5f8f4;padding:34px 27px 100px}.control-panel .brand{color:#f5f8f4}.control-panel .brand-mark{background:#315446;color:#d4f0dd}.control-panel h1{font-size:27px;letter-spacing:-.03em;line-height:1.13;margin:62px 0 12px}.control-panel .muted{color:#aebdb2}.panel-block{border-top:1px solid #34453c;margin-top:30px;padding-top:18px}.panel-label{color:#aebdb2;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px}.dark-select,.dark-input{width:100%;border:1px solid #52665a;background:#25332b;color:#f5f8f4;padding:10px;border-radius:7px}.dark-option{display:grid;grid-template-columns:1fr auto;gap:5px;padding:10px 0;border-bottom:1px solid #34453c}.dark-option:last-child{border-bottom:0}.dark-option label{font-size:13px}.dark-option small{display:block;color:#9fb1a4;font-size:11px;margin-top:2px}.control-main{padding:29px clamp(18px,4vw,52px) 100px}.control-main-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:1px solid #d3dbd2;padding-bottom:23px}.control-main h2{font-size:22px;margin:3px 0 5px}.control-main .surface{box-shadow:0 1px 2px #273c2c0a}.metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:21px 0}.metric{padding:15px;background:#fff;border:1px solid #dce2da;border-radius:10px}.metric-label{color:#728077;font-size:11px}.metric strong{display:block;font-size:20px;margin-top:6px}.control-calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.control-calc .calc{background:#fff}.detail-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf0eb;font-size:13px}.detail-row:last-child{border-bottom:0}.detail-row span:last-child{font-weight:650}.info-link{color:#176448;font-size:12px;text-decoration:none}.mini-note{font-size:12px;color:#728077;margin-top:10px}
    @media(max-width:820px){.workspace{display:block}.sidebar{display:none}.topbar{height:60px}.content{padding-top:25px}.summary{display:block}.summary .button{margin-top:18px}.model-grid,.calc-grid,.recent,.control-calc{grid-template-columns:1fr}.model h3{font-size:25px}.section-head{margin-top:27px}.control-grid{display:block}.control-panel{min-height:auto;padding:22px 18px 23px}.control-panel h1{margin:30px 0 10px}.control-panel .panel-block{display:none}.control-main{padding:25px 18px 100px}.control-main-head{display:block}.metric-row{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.focus-header{height:60px;padding:0 18px}.focus-main{padding-top:31px}.focus-title{font-size:28px}.result-strip{grid-template-columns:1fr}.prototype-note{bottom:9px;max-width:calc(100vw - 18px)}.prototype-note strong{min-width:112px}}
    @media(max-width:420px){.top-actions .button.ghost{display:none}.summary-meta{gap:17px}.metric-row{grid-template-columns:1fr}.metric:last-child{grid-column:auto}.prototype-note strong{min-width:95px;font-size:11px}.prototype-note{gap:5px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const variants={a:'A · 工作台',b:'B · 聚焦流程',c:'C · 控制台'};
    const current=(new URLSearchParams(location.search).get('variant')||'a').toLowerCase();
    const variant=variants[current]?current:'a';
    const iconMark='<span class="brand-mark">M</span>';
    const header=(actions='')=>`<header class="topbar"><div class="brand">${iconMark}<span>Mealnote</span></div><div class="top-actions">${actions||'<button class="button ghost">数据管理</button><button class="button primary">记录体重</button>'}</div></header>`;
    const modelCards=`<div class="model-grid"><article class="surface model"><div class="model-head"><span class="model-name">FEDIAF 2025</span><span class="status"><i class="dot"></i>已启用</span></div><h3>247–356 <small style="font-size:14px;font-weight:500;color:#718077">kcal/day</small></h3><p class="muted">室内 / 已绝育成年猫 · 3.8 kg</p><div class="model-foot"><span class="muted">参考区间</span><button class="text-button" data-detail="fediaf">查看计算详情 ↗</button></div></article><article class="surface model"><div class="model-head"><span class="model-name">AAHA 2021</span><span class="status"><i class="dot"></i>已启用</span></div><h3>228–266 <small style="font-size:14px;font-weight:500;color:#718077">kcal/day</small></h3><p class="muted">已绝育成年猫 · 系数 1.2–1.4</p><div class="model-foot"><span class="muted">参考区间</span><button class="text-button" data-detail="aaha">查看计算详情 ↗</button></div></article></div>`;
    const calcCards=`<div class="calc-grid"><article class="surface calc"><div class="calc-top"><div><h3>单纯干粮</h3><p class="muted">Orijen Original</p></div><span class="calc-tag">主粮</span></div><div class="food-row"><div class="food-name">4.2 kcal/g</div><div class="food-value">59–85 <span class="food-unit">g / day</span></div></div><div class="calc-actions"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="text-button">编辑食品</button></div></article><article class="surface calc"><div class="calc-top"><div><h3>单纯湿粮</h3><p class="muted">Nulo Freestyle · 85 g/罐</p></div><span class="calc-tag">湿粮</span></div><div class="food-row"><div class="food-name">72 kcal / 罐</div><div class="food-value">3.4–4.9 <span class="food-unit">罐 / day</span></div></div><div class="calc-actions"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="text-button">编辑食品</button></div></article><article class="surface calc"><div class="calc-top"><div><h3>干湿混合</h3><p class="muted">Orijen + Nulo Freestyle</p></div><span class="calc-tag">混合</span></div><div class="food-row"><div class="food-name">1 罐湿粮</div><div class="food-value">42–68 <span class="food-unit">g 干粮 / day</span></div></div><div class="calc-actions"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="text-button">调整数量</button></div></article><article class="surface calc"><div class="calc-top"><div><h3>餐包加干粮</h3><p class="muted">Sheba 餐包 · 85 g/份</p></div><span class="calc-tag">混合</span></div><div class="food-row"><div class="food-name">1 份餐包</div><div class="food-value">41–67 <span class="food-unit">g 干粮 / day</span></div></div><div class="calc-actions"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="text-button">调整数量</button></div></article></div>`;
    const detailModal=`<div class="modal-backdrop" id="detail-modal" hidden><div class="modal surface"><button class="modal-close" aria-label="关闭">×</button><p class="eyebrow">计算详情</p><h2>AAHA 2021 · 已绝育成年猫</h2><div class="detail-table"><div><span>输入体重</span><strong>3.8 kg</strong></div><div><span>年龄阶段</span><strong>成年猫</strong></div><div><span>本次类别</span><strong>已绝育成年猫</strong></div><div><span>系数</span><strong>1.2–1.4</strong></div><div><span>公式</span><strong>RER = 70 × BW^0.75<br>MER = RER × 1.2–1.4</strong></div><div><span>结果</span><strong>228–266 kcal/day</strong></div></div><a href="https://www.aaha.org/resources/2021-aaha-nutrition-and-weight-management-guidelines/weight-reduction-in-the-obese-pet/" target="_blank" rel="noreferrer">查看指南来源 ↗</a></div></div>`;
    function variantA(){return `<div class="shell">${header()}<div class="workspace"><aside class="sidebar"><div class="side-label">当前猫咪</div><button class="nav active">Mochi <span style="float:right;color:#849189">⌄</span></button><div class="side-label" style="margin-top:28px">工作区</div><nav class="nav"><button class="active">计算</button><button>体重趋势</button><button>食品库</button><button>历史记录</button></nav><div class="side-label" style="margin-top:28px">数据</div><nav class="nav"><button>猫咪档案</button><button>导出备份</button></nav></aside><main class="content"><section class="summary"><div><p class="eyebrow">今天 · 2026 年 10 月 9 日</p><h1 class="heading">Mochi 的喂养计算</h1><div class="summary-meta"><div><div class="meta-label">当前体重</div><div class="meta-value">3.8 kg</div></div><div><div class="meta-label">年龄</div><div class="meta-value">2 岁 3 个月</div></div><div><div class="meta-label">体重记录</div><div class="meta-value">今天 · 09:14</div></div></div></div><button class="button primary">更新体重</button></section><div class="section-head"><div><h2>热量参考</h2><p class="muted">基于今天的体重记录</p></div><button class="button">模型设置</button></div>${modelCards}<div class="section-head"><div><h2>喂养换算</h2><p class="muted">主视图只显示当前选择和结果</p></div><button class="button primary">添加食品</button></div><div class="conversion-bar"><span><strong style="font-size:13px">当前换算依据</strong><br><span class="muted">食品数量按所选模型计算</span></span><select aria-label="当前换算依据"><option>FEDIAF 2025 · 247–356 kcal</option><option>AAHA 2021 · 228–266 kcal</option></select></div>${calcCards}<div class="section-head"><div><h2>最近记录</h2><p class="muted">只展示已保存的快照</p></div><button class="text-button">查看全部 ↗</button></div><div class="recent"><article class="surface"><div class="list-row"><div><strong>体重记录</strong><small>2026-10-09 09:14</small></div><strong>3.8 kg</strong></div><div class="chart"><svg viewBox="0 0 600 120" preserveAspectRatio="none"><line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="82" x2="600" y2="82"/><polyline points="0,82 115,72 230,79 345,48 460,56 600,35"/><circle cx="0" cy="82" r="5"/><circle cx="115" cy="72" r="5"/><circle cx="230" cy="79" r="5"/><circle cx="345" cy="48" r="5"/><circle cx="460" cy="56" r="5"/><circle cx="600" cy="35" r="5"/></svg></div><div class="calc-actions"><button class="text-button">打开体重趋势 ↗</button></div></article><article class="surface"><div class="list-row"><div><strong>最近计算</strong><small>FEDIAF 2025 · 2026-10-08</small></div><strong>已保存</strong></div><div class="list"><div class="list-row"><span>Orijen Original</span><strong>59–85 g</strong></div><div class="list-row"><span>Nulo Freestyle</span><strong>3.4–4.9 罐</strong></div></div><div class="calc-actions"><button class="text-button">打开历史记录 ↗</button></div></article></div></main></div></div>${detailModal}`}
    function variantB(){return `<div class="focus-page">${header('<button class="button ghost">数据管理</button><button class="button primary">保存本次计算</button>')}<main class="focus-main"><p class="eyebrow">Mochi · 3.8 kg · 2026-10-09</p><h1 class="focus-title">今天喂多少？</h1><p class="focus-intro">选择模型和食品，得到一份可追溯的每日参考。</p><div class="step"><span class="step-no">1</span><div class="step-content"><h2>热量参考</h2><div class="choice-row"><button class="choice selected">FEDIAF 2025<br><small>247–356 kcal</small></button><button class="choice">AAHA 2021<br><small>228–266 kcal</small></button></div></div></div><div class="step"><span class="step-no">2</span><div class="step-content"><h2>选择换算依据</h2><div class="choice-row"><button class="choice selected">FEDIAF 2025 · 247–356 kcal</button><button class="choice">AAHA 2021 · 228–266 kcal</button></div></div></div><div class="result-strip"><div class="result-box"><span>已选参考</span><strong>247–356 kcal</strong></div><div class="result-box"><span>基于</span><strong>3.8 kg · 成年猫</strong></div></div><div class="focus-card"><h3>单纯干粮</h3><p class="small">Orijen Original · 4.2 kcal/g</p><div class="quantity"><span>每日参考食量</span><strong>59–85 g</strong></div><div class="link-row"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="button">更换食品</button></div></div><div class="focus-card"><h3>干湿混合</h3><p class="small">Orijen Original + Nulo Freestyle</p><div class="quantity"><span>1 罐湿粮后</span><strong>42–68 g 干粮</strong></div><div class="link-row"><button class="text-button" data-detail="calc">查看计算详情 ↗</button><button class="button">调整数量</button></div></div><button class="button primary focus-save">保存本次计算</button><div class="focus-footer"><span>最近体重记录：今天</span><button class="text-button">查看历史记录 ↗</button></div></main></div>${detailModal}`}

    document.getElementById('app').innerHTML=variant==='a'?variantA():variant==='b'?variantB():variantC();
    const switcher=document.createElement('div');switcher.className='prototype-note';switcher.innerHTML='<button aria-label="上一个方案" data-dir="-1">‹</button><strong>原型 · '+variants[variant]+'</strong><button aria-label="下一个方案" data-dir="1">›</button>';document.body.appendChild(switcher);
    function go(dir){const keys=Object.keys(variants),next=keys[(keys.indexOf(variant)+dir+keys.length)%keys.length];location.search='?variant='+next}
    switcher.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.dir))));document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
